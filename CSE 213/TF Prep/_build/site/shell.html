<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var T={},U={},G=D.groups;
D.topics.forEach(function(t){T[t.id]=t}); D.units.forEach(function(u){U[u.id]=u});
var EM={}; D.emap.rows.forEach(function(r){EM[r.id]=r});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var done={},solved={};
try{done=JSON.parse(st("c213-done")||"{}");solved=JSON.parse(st("c213-solved")||"{}")}catch(e){}
function save(){st("c213-done",JSON.stringify(done));st("c213-solved",JSON.stringify(solved))}
var nDone=function(){return Object.keys(done).filter(function(k){return done[k]}).length};

/* ---------- theme */
function setTheme(t){var r=document.documentElement;if(t==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);st("c213-theme",t);$$("#theme button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)})}
$("#theme").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setTheme(b.dataset.t)});
setTheme(st("c213-theme")||"system");

/* ---------- sidebar */
function side(cur){
  var h="";
  [["A","Anindya Sir · Design, UML, testing"],["B","IJ Mam · Patterns, process, quality"]].forEach(function(p){
    h+="<h4>"+p[1]+"</h4>";
    D.units.filter(function(u){return u.part===p[0]}).forEach(function(u){
      h+="<h4 style='margin-top:10px;text-transform:none;letter-spacing:0;font:600 12.5px var(--f-sans);color:var(--fg-strong)'><a href='#u-"+u.id+"' style='padding:0'>"+esc(u.title)+"</a></h4>";
      u.lessons.forEach(function(id){var t=T[id];h+="<a href='#t-"+id+"' class='"+(cur==="t-"+id?"on ":"")+(done[id]?"done":"")+"'><span class='n'>"+(t.part==="A"?"":"B")+t.num+"</span><span>"+esc(t.title)+"</span></a>"});
    });
  });
  $("#side").innerHTML=h;
}

/* ---------- pieces */
function mk(n){return n==null?"":(Math.round(n*10)/10)}
function ql(e){return "<b>"+esc(e.year)+" · Q"+esc(e.qno)+"</b><span class='m'>"+esc(e.marks)+" marks</span><span class='chip'>"+esc(e.course)+"</span>"+(e.date?"<span class='chip'>"+esc(e.date)+"</span>":"")}
function qcard(e,gid){
  var g=G[gid],h="<div class='qcard' data-gid='"+gid+"'><div class='qh'>"+(e.kind==="practice"?"<b>Practice "+esc(e.n)+"</b><span class='m'>"+esc(e.marks)+" marks</span>":ql(e));
  if(e.kind!=="practice"&&e.topic&&T[e.topic])h+="<a class='chip hot' href='#t-"+e.topic+"'>"+esc(T[e.topic].title)+"</a>";
  h+="</div>";
  var txt=e.kind==="practice"?e.title:e.text; if(txt)h+="<div class='qtext'>"+esc(txt)+"</div>";
  var same=g.entries.filter(function(x){return x!==e}).map(function(x){return x.kind==="practice"?"":x.year+" Q"+x.qno}).filter(Boolean);
  if(same.length)h+="<div class='qtext' style='color:var(--muted);font-size:13px'>Same question also in: "+esc(same.join(", "))+"</div>";
  h+="<div class='qact'><button class='btn sm' data-show='"+gid+"'>Show question and solution</button><label style='font-size:13px;color:var(--muted)'><input type='checkbox' data-solved='"+gid+"'"+(solved[gid]?" checked":"")+"> I can solve this</label></div></div>";
  return h;
}
function gcard(gid){ // a group listed on a topic page
  var g=G[gid],ps=g.entries.filter(function(e){return e.kind==="paper"});
  var e=ps[0]||g.entries[0];
  var h="<div class='qcard' data-gid='"+gid+"'><div class='qh'>"+ps.map(function(x){return "<b>"+esc(x.year)+" Q"+esc(x.qno)+"</b><span class='m'>"+esc(x.marks)+"</span>"}).join("<span style='color:var(--line)'>|</span>")+"</div>";
  var txt=ps.map(function(x){return x.text}).filter(Boolean)[0]; if(txt)h+="<div class='qtext'>"+esc(txt)+"</div>";
  h+="<div class='qact'><button class='btn sm' data-show='"+gid+"'>Show question and solution</button><label style='font-size:13px;color:var(--muted)'><input type='checkbox' data-solved='"+gid+"'"+(solved[gid]?" checked":"")+"> I can solve this</label></div></div>";
  return h;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-show]");
  if(b){var card=b.closest(".qcard"),ex=$(".qimg",card);if(ex){ex.remove();b.textContent="Show question and solution";return}
    var g=G[b.dataset.show],d=document.createElement("div");d.className="qimg";d.innerHTML="<img src='"+g.img+"' width='"+g.w+"' height='"+g.h+"' alt='Question and solution' loading='lazy' data-zoom='1'>";card.appendChild(d);b.textContent="Hide";return}
  var z=e.target.closest("img[data-zoom]");
  if(z){$("#zimg").src=z.src;$("#zoom").classList.add("on");return}
  if(e.target.closest("#zoom")){$("#zoom").classList.remove("on");return}
  var dn=e.target.closest("[data-done]");
  if(dn){var id=dn.dataset.done;done[id]=!done[id];save();route();return}
});
document.addEventListener("change",function(e){var c=e.target.closest("[data-solved]");if(c){solved[c.dataset.solved]=c.checked;save()}});

function countdown(){

function topic(id){
  var t=T[id],u=U[t.unit],em=EM[id],i=D.topics.indexOf(t),pv=D.topics[i-1],nx=D.topics[i+1];
  var h="<div class='crumb'><a href='#u-"+u.id+"'>"+esc(u.title)+"</a> · "+(t.part==="A"?"Anindya Sir":"IJ Mam")+"</div><h1>Lesson "+t.num+" · "+esc(t.title)+"</h1>"+(t.source?"<div class='src'>"+esc(t.source)+"</div>":"");
  h+="<div class='chips'>"+(em?"<span class='chip "+(em.years>=3?"hot":"")+"'>asked in "+em.years+" of last 7 papers</span>":"")+"<span class='chip'>"+t.q.length+" solved question"+(t.q.length===1?"":"s")+"</span><button class='btn sm "+(done[id]?"on":"")+"' data-done='"+id+"'>"+(done[id]?"✓ Done":"Mark done")+"</button></div>";
  h+=t.html;

    h+="<h2>Past-paper questions on this topic</h2>";
    var chap=t.q.map(function(g){return G[g]}).some(function(g){return !g.exact});
    h+="<p class='prov'>"+(chap?"Questions the book files under this chapter are shown too; some may cover a neighbouring lesson of the same unit.":"")+" Open a card to see the printed question with its solution.</p>";

    ordered.forEach(function(g){h+=gcard(g)});
  }
  h+="<div class='nextprev'>"+(pv?"<a href='#t-"+pv.id+"'><small>Previous</small>"+esc(pv.title)+"</a>":"<span></span>")+(nx?"<a class='nx' href='#t-"+nx.id+"'><small>Next</small>"+esc(nx.title)+"</a>":"")+"</div>";
  return h;
}
function unit(id){
  var u=U[id];

function papers(){

  p.entries.forEach(function(e){if(e.course!==last){h+="<h3>"+esc(e.course)+(e.date?" · "+esc(e.date):"")+"</h3>";last=e.course}h+=qcard(e,e.gid)});

function emap(){
  var Y=D.emap.years,h="<h1>Exam map</h1><p>How often each lesson was asked in the last seven term finals (2018-19 to 2024-25, CSE 307 and CSE 213 papers). Darker means more questions. Focus on the lessons with four or more papers first.</p>";
  h+="<div class='filter'><button class='btn sm "+(window.__ms==="f"?"on":"")+"' data-ms='f'>Sort by frequency</button><button class='btn sm "+(window.__ms!=="f"?"on":"")+"' data-ms=''>Syllabus order</button></div>";

  var lastu="";

    h+="<tr><td><a href='#t-"+r.id+"'>"+(T[r.id].part==="A"?"":"B")+T[r.id].num+" · "+esc(r.title)+"</a></td>"+r.counts.map(function(c){return "<td class='c' style='"+(c?"background:color-mix(in srgb,var(--accent) "+Math.min(80,18+c*22)+"%,transparent)":"")+"'>"+(c||"")+"</td>"}).join("")+"<td class='c'>"+r.years+"/7</td><td class='c'>"+mk(r.marks)+"</td></tr>";

document.addEventListener("click",function(e){var b=e.target.closest("[data-ms]");if(b){window.__ms=b.dataset.ms;route()}});
function sheet(){
  var h="<h1>Cheat sheet</h1><p>One page of rules to read in the last hour. The quick notes of every unit follow the tables.</p>"+D.sheet+"<h2>Quick notes by unit</h2>";
  D.units.forEach(function(u){h+="<h3>"+esc(u.title)+"</h3>"+u.quick});
  return h;
}
var PICK=[["Create objects without naming the concrete class (one product)","Factory Method","t-a5"],["Create a matching family of products","Abstract Factory","t-a6"],["Exactly one shared instance","Singleton","t-a7"],["Build a complex object step by step","Builder","t-a8"],["Add features to an object at run time, no subclass explosion","Decorator","t-i1"],["Treat one object and a tree of objects the same way","Composite","t-i2"],["Reuse a class whose interface does not match","Adapter","t-i3"],["Two dimensions that vary independently","Bridge","t-i4"],["Swap an algorithm at run time","Strategy","t-i5"],["Fixed skeleton, subclasses fill in the steps","Template Method","t-i6"],["Notify many dependents when one object changes","Observer","t-i7"],["Untangle many-to-many object communication","Mediator","t-i8"],["Behaviour depends on the object's internal state","State","t-i9"]];
function tools(){
  var h="<h1>Tools</h1>";
  var tgt=new Date(2026,10,21),now=new Date(),dd=Math.ceil((tgt-now)/864e5);
  h+="<div class='tool'><h3>Five-day plan</h3><p class='prov'>Exam on 21 Nov"+(dd>0?" ("+dd+" days left)":"")+". Ticking a lesson here marks it done everywhere.</p>";
  D.plan.forEach(function(p){
    var d=new Date(tgt.getTime()-(6-p.day)*864e5),dn=p.items.filter(function(i){return done[i]}).length;
    h+="<div class='day'><div class='dt'>Day "+p.day+" · "+d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+"</div><h4>"+esc(p.title)+"</h4><div style='font-size:13.5px;color:var(--muted)'>"+esc(p.note)+"</div><div class='bar'><i style='width:"+Math.round(100*dn/p.items.length)+"%'></i></div>";
    p.items.forEach(function(i){h+="<label><input type='checkbox' data-pd='"+i+"'"+(done[i]?" checked":"")+"><a href='#t-"+i+"'>"+(T[i].part==="A"?"":"B")+T[i].num+" · "+esc(T[i].title)+"</a></label>"});
    h+="</div>";
  });
  h+="</div>";
  h+="<div class='tool'><h3>Cyclomatic complexity</h3><p class='prov'>V(G) = E − N + 2 = P + 1. Count the edges and nodes of the flow graph, or just the decisions.</p><div class='row'><label>Edges E<input type='number' id='cE' value='9' min='0'></label><label>Nodes N<input type='number' id='cN' value='7' min='0'></label><label>or decisions P<input type='number' id='cP' min='0' placeholder='optional'></label></div><div class='out' id='cOut'></div></div>";
  h+="<div class='tool'><h3>Equivalence classes and BVA</h3><p class='prov'>Closed integer range [a, b]. Boundary tests as taught: a−1, a, a+1, b−1, b, b+1.</p><div class='row'><label>Lower a<input type='number' id='bA' value='30'></label><label>Upper b<input type='number' id='bB' value='70'></label></div><div class='out' id='bOut'></div></div>";
  h+="<div class='tool'><h3>Which pattern?</h3><div class='row'><label style='flex:1;min-width:240px'>The problem says…<select id='pk' style='width:100%'>"+PICK.map(function(p,i){return "<option value='"+i+"'>"+esc(p[0])+"</option>"}).join("")+"</select></label></div><div class='out' id='pOut'></div></div>";
  return h;
}
function toolsInit(){
  function c(){var E=+$("#cE").value,N=+$("#cN").value,P=$("#cP").value;var v=P!==""?(+P+1):(E-N+2);$("#cOut").innerHTML="<strong>V(G) = "+v+"</strong>: "+v+" independent (basis) paths, so at least "+v+" test cases for branch coverage."+(P!==""?" Computed from P + 1.":" Computed from E − N + 2.")}
  function b(){var a=+$("#bA").value,z=+$("#bB").value;if(a>z){$("#bOut").textContent="Lower bound must not exceed the upper bound.";return}
    $("#bOut").innerHTML="Classes: invalid &lt; "+a+", valid "+a+"–"+z+", invalid &gt; "+z+" (3 tests, one each).<br>BVA: <code>"+[a-1,a,a+1,z-1,z,z+1].join(", ")+"</code> (add a nominal value such as "+Math.round((a+z)/2)+")."}
  function p(){var x=PICK[+$("#pk").value];$("#pOut").innerHTML="<strong>"+x[1]+"</strong> · <a href='#"+x[2]+"'>open the lesson</a>"}
  ["cE","cN","cP"].forEach(function(i){$("#"+i).oninput=c});["bA","bB"].forEach(function(i){$("#"+i).oninput=b});$("#pk").onchange=p;c();b();p();
}

/* ---------- router */
function route(){
  var k=(location.hash||"#home").slice(1)||"home",v=$("#view"),nav="home",h;
  document.body.classList.remove("open");
  if(k==="home"){h=home();nav="home"}
  else if(k.indexOf("t-")===0&&T[k.slice(2)]){h=topic(k.slice(2));nav="home"}
  else if(k.indexOf("u-")===0&&U[k.slice(2)]){h=unit(k.slice(2));nav="home"}
  else if(k==="papers"){h=papers();nav="papers"}
  else if(k.indexOf("p-")===0){h=paper(k.slice(2));nav="papers"}
  else if(k==="practice"){h=practice();nav="practice"}
  else if(k==="map"){h=emap();nav="map"}
  else if(k==="sheet"){h=sheet();nav="sheet"}
  else if(k==="tools"){h=tools();nav="tools"}
  else {h=home()}
  v.innerHTML=h;
  $$("#nav a").forEach(function(a){a.classList.toggle("on",a.dataset.k===nav)});
  side(k);countdown();if(k==="tools")toolsInit();
  var tt=k.indexOf("t-")===0&&T[k.slice(2)];document.title=tt?"Lesson "+T[k.slice(2)].num+" · CSE 213 Green Card":"CSE 213 Green Card";
}

/* ---------- menu, search */
$("#burger").onclick=function(){document.body.classList.toggle("open")};$("#scrim").onclick=function(){document.body.classList.remove("open")};
var IDX=null;
function strip(h){return h.replace(/<[^>]+>/g," ").replace(/\s+/g," ")}
function buildIdx(){IDX=[];
  D.topics.forEach(function(t){IDX.push({h:"#t-"+t.id,t:"Lesson "+t.num+" · "+t.title,s:(t.part==="A"?"Anindya Sir":"IJ Mam")+" · "+U[t.unit].title,x:(t.title+" "+strip(t.html)).toLowerCase(),w:3})});
  D.units.forEach(function(u){IDX.push({h:"#u-"+u.id,t:u.title+" · quick notes and exam map",s:"Unit",x:(u.title+" "+strip(u.quick)).toLowerCase(),w:2})});
  D.papers.forEach(function(p){p.entries.forEach(function(e){if(e.text)IDX.push({h:"#p-"+p.id,t:p.id+" Q"+e.qno+" · "+e.text.slice(0,90),s:e.course+" · "+e.marks+" marks",x:(e.text+" "+e.year+" q"+e.qno).toLowerCase(),w:1})})});
  [["#papers","Past papers"],["#practice","Practice"],["#map","Exam map"],["#sheet","Cheat sheet"],["#tools","Tools: plan, complexity, BVA, pattern picker"]].forEach(function(x){IDX.push({h:x[0],t:x[1],s:"Page",x:x[1].toLowerCase(),w:2})});
}
var sel=0,res=[];
function search(q){if(!IDX)buildIdx();q=q.toLowerCase().trim();var box=$("#mres");if(!q){res=IDX.filter(function(i){return i.w>=2}).slice(0,12)}else{var tk=q.split(/\s+/);res=IDX.filter(function(i){return tk.every(function(t){return i.x.indexOf(t)>=0})}).sort(function(a,b){var ta=a.t.toLowerCase().indexOf(tk[0])>=0?1:0,tb=b.t.toLowerCase().indexOf(tk[0])>=0?1:0;return tb-ta||b.w-a.w}).slice(0,14)}
  sel=0;box.innerHTML=res.length?res.map(function(r,i){return "<a href='"+r.h+"' class='"+(i===0?"sel":"")+"'>"+esc(r.t)+"<small>"+esc(r.s)+"</small></a>"}).join(""):"<a style='color:var(--muted)'>No match</a>"}
function openJ(){$("#modal").classList.add("on");$("#q").value="";search("");setTimeout(function(){$("#q").focus()},0)}
function closeJ(){$("#modal").classList.remove("on")}
$("#jump").onclick=openJ;$("#q").oninput=function(){search(this.value)};
$("#modal").addEventListener("click",function(e){if(e.target===this||e.target.closest("a[href]"))closeJ()});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openJ();return}
  if(e.key==="Escape"){closeJ();$("#zoom").classList.remove("on");return}
  if($("#modal").classList.contains("on")&&(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter")){e.preventDefault();var as=$$("#mres a");if(!as.length)return;
    if(e.key==="Enter"){if(res[sel]){location.hash=res[sel].h;closeJ()}return}
    sel=(sel+(e.key==="ArrowDown"?1:-1)+as.length)%as.length;as.forEach(function(a,i){a.classList.toggle("sel",i===sel)});as[sel].scrollIntoView({block:"nearest"})}
});
})();
</script>
